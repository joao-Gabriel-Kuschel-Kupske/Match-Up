<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../static/css/stylesisenum.css">
        <title>Sistema e números decimais - aula</title>
    </head>
    <body>
        <div id="borda">
            <header>
                <a href="{{ url_for('entrar') }}" class="btn1">
                    <img src="../static/assets/imagens/logo.png" alt="logo-match-up" class="logo">
                </a>
                <a href="{{ url_for('area_aluno') }}">
                    <div id="perfil">
                       <img src="{{ user.foto_perfil }}" alt="Foto de perfil" class="ft-perfil">
                        <h4>{{ user.nome }}</h4>
                    </div>
                </a>
            </header>

            <section class="title">
                <a href="{{ url_for('entrar') }}"><button class="round-btn">←</button></a>
                <div class="discribe">
                    <img src="../static/assets/imagens/logo-pag-sisenum.png" alt="Número 10">
                    <h1>Sistema e números decimais</h1>
                    <div id="show-middle">
                        <span class="media_av">{{ media_modulo }}</span>
                        <span id="star-shown" class="star-full">★</span>
                    </div>
                </div>
            </section>
            </main>

            <main>
                <div class = "pdf-container">
                    <iframe src="../static/aulas/Sistema decimal.pdf" alt="lesson"class="pdf-full">
                    </iframe>
                </div>
            </main>

            <section id="review">
                <h3>Avalie esse módulo e nos ajude a melhorar:</h3>
                <div id="avalue">
                    <form method="POST" action="{{ url_for('avaliar_sisenum') }}">
                        <div class="rating">
                            <span data-value="1" class="star-full">★</span>
                            <span data-value="2" class="star-full">★</span>
                            <span data-value="3" class="star-full">★</span>
                            <span data-value="4" class="star-full">★</span>
                            <span data-value="5" class="star-full">★</span>
                        </div>
                        <input type="hidden" name="rating" id="rating-value" value="5">
                        <div class="btn-rating"> 
                            <button type="submit" class="env-aval">Enviar</button>
                        </div>
                    </form>
                </div>
                <script>
                    const stars = document.querySelectorAll('.rating span');
                    const ratingInput = document.getElementById('rating-value');

                    stars.forEach(star => {
                        star.addEventListener('click', () => {
                            const value = star.getAttribute('data-value');
                            ratingInput.value = value;

                            // Atualiza visualmente as estrelas
                            stars.forEach(s => {
                                if (s.getAttribute('data-value') <= value) {
                                    s.classList.remove('star-empty');
                                    s.classList.add('star-full');
                                } else {
                                    s.classList.add('star-empty');
                                    s.classList.remove('star-full');
                                }
                            });
                        });
                    });
                </script>
            </section>
        </div>

        <footer>
            <p>© 2025 - Todos os direitos reservados</p>
        </footer>
    </body>
</html>
